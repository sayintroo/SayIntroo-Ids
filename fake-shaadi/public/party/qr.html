<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join QR · #AanshKiShaadi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/party.css">
<style>
  .poster { max-width: 520px; margin: 0 auto; text-align: center; padding: 28px 16px; }
  h1 { font-size: clamp(44px, 13vw, 68px); line-height: 0.92; letter-spacing: -0.04em; margin: 8px 0 18px; }
  h1 .serif { color: var(--gold); display: block; }
  #qr canvas { width: min(340px, 80vw); height: auto; border-radius: 18px; border: 6px solid var(--gold); }
  .url { font-family: var(--mono); margin-top: 10px; word-break: break-all; }
  .steps { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
  .steps span { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
  .tools { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .alt { margin-top: 30px; }
  .alt canvas { width: 150px; height: auto; border-radius: 10px; }
  @media print {
    body { background: #fff !important; color: #000; }
    .tools, .footer { display: none; }
    .muted, .url, .mono { color: #333 !important; }
    h1 .serif { color: #b8860b; }
    .steps span { border-color: #999; }
  }
</style>
</head>
<body>
<div class="poster">
  <div class="mono gold" id="tag"></div>
  <h1>Scan karo, <span class="serif">team pao</span></h1>
  <div id="qr"></div>
  <div class="url" id="url"></div>
  <div class="steps"><span>1. Scan 📱</span><span>2. Naam + Insta</span><span>3. Team milegi 💃🕺</span></div>
  <p class="muted">Polls · Gossip · Aura points · Rishta Pakka 💘</p>
  <div class="tools">
    <button class="btn" onclick="print()">Print 🖨️</button>
    <a class="btn ghost" id="dl" download="aanshkishaadi-join-qr.png">Download PNG</a>
  </div>
  <div class="alt">
    <div class="mono muted">Shagun page QR (NGO donations)</div>
    <div id="qr2" style="margin-top:8px;"></div>
  </div>
</div>
<footer class="footer">Built by <b>SayIntro</b></footer>
<script src="/config.js"></script>
<script src="/assets/vendor/qrcode-1.4.4.js"></script>
<script src="/assets/vendor/supabase-2.117.2.js"></script>
<script src="/assets/app.js"></script>
<script>
  const url = location.origin + '/party';
  document.getElementById('tag').textContent = CONFIG.event.hashtag + ' · ' + CONFIG.event.venue;
  document.getElementById('url').textContent = url.replace(/^https?:\/\//, '');
  const cv = App.qrCanvas(url, 900, '#0d0405', '#ffffff');
  document.getElementById('qr').appendChild(cv);
  document.getElementById('dl').href = cv.toDataURL('image/png');
  document.getElementById('qr2').appendChild(App.qrCanvas(location.origin + '/', 400, '#0d0405', '#ffffff'));
</script>
</body>
</html>
